kind = "web"
previewPath = "/"
title = "Jump PropTech"
description = "Jump Living's rental property management app for South African landlords to manage residential properties, rental units, tenants, rent records, maintenance, reports, and profile settings."
version = "1.0.0"
id = "artifacts/jump-proptech"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24687

[services.development]
run = "pnpm --filter @workspace/jump-proptech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jump-proptech", "run", "build" ]
serve = "static"
publicDir = "artifacts/jump-proptech/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24687"
BASE_PATH = "/"
