[build]
  base = "artifacts/jump-proptech"
  # 1. verify-netlify-env.mjs fails fast if API_URL is missing/malformed.
  # 2. pnpm build produces dist/ (cleaning it first).
  # 3. write-api-redirects.mjs generates dist/_redirects with the REAL API_URL:
  #    Netlify does not interpolate env vars in netlify.toml [[redirects]]
  #    ("to = ${API_URL}..." stays a literal string), so the proxy rule must
  #    be written into the publish directory instead. Vite cleans dist on
  #    every build, which is why this step runs after the build.
  command = "node ../../scripts/verify-netlify-env.mjs && pnpm build && node ../../scripts/write-api-redirects.mjs"
  publish = "dist"

[build.environment]
  # ─────────────────────────────────────────────────────────────────────
  # Secrets scanning configuration (permanent fix, lives in the repo)
  # ─────────────────────────────────────────────────────────────────────
  # SECRETS_SCAN_OMIT_KEYS tells the Netlify scanner to skip checking the
  # VALUES of exactly the env var names listed below — permanently, in
  # the repo, so it survives any future redeploy or Netlify UI change.
  #
  # Why each key is omitted:
  #   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
  #     Vite intentionally inlines VITE_* env vars into the client bundle
  #     at build time. The Supabase ANON key is a PUBLIC key — it is
  #     designed to ship to browsers (Row Level Security protects the
  #     data, not key secrecy), so flagging it is a false positive.
  #   SUPABASE_URL / SUPABASE_ANON_KEY
  #     Same false positive — matched only because their values equal
  #     the VITE_ variants that end up in the bundle.
  #   NODE_ENV
  #     The scanner matched the word "production" inside README/LICENSE
  #     files of installed Netlify plugins' node_modules — repo noise,
  #     not actual secrets.
  #
  # REAL secrets (DATABASE_URL, service keys, API tokens) are NOT listed
  # here and remain fully scanned — a leak of those still fails the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,NODE_ENV"
  # Bundle output is scanned as "repo files"; the anon key is public-by-design
  # and plugin node_modules contain false-positive matches, so omit those paths too.
  SECRETS_SCAN_OMIT_PATHS = "dist/**,artifacts/jump-proptech/.netlify/plugins/**"

[dev]
  command = "pnpm dev:web"
  port = 5173

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# NOTE: the /api/* proxy is NOT declared here — netlify.toml cannot
# interpolate environment variables into [[redirects]] ("to = ${API_URL}"
# would stay a literal string and never reach the backend). Instead,
# scripts/write-api-redirects.mjs generates dist/_redirects at build time:
#   /api/* <API_URL>/api/:splat 200
# _redirects rules are processed before netlify.toml rules, so it takes
# precedence over the SPA catch-all below.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200