[build]
  base = "artifacts/jump-proptech"
  command = "pnpm build"
  publish = "dist/public"

[dev]
  command = "pnpm dev:web"
  port = 5173

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "${API_URL}/api/:splat"
  status = 200
  conditions = {Method = ["GET", "POST", "PATCH", "DELETE"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200